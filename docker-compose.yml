version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: security_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: sec_rootpassword
      MYSQL_DATABASE: security_test_db
      MYSQL_USER: sec_user
      MYSQL_PASSWORD: sec_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_sec_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psec_rootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: security_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_sec_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: security_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=sec_user
      - MYSQL_PASSWORD=sec_password
      - MYSQL_DATABASE=security_test_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GROQ_API_KEY=${GROQ_API_KEY:-gsk_placeholder}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports
      - ./target_samples:/app/target_samples

  frontend:
    image: node:20-alpine
    container_name: security_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  mysql_sec_data:
  redis_sec_data:

networks:
  default:
    name: security_network
